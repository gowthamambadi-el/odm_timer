<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>15 Minute Timer | YANC</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary-orange: #f37021;
      --primary-orange-hover: #d65d14;
      --primary-green: #8cc63f;
      --primary-green-hover: #73aa2f;
      --bg-dark: #0f172a;
      --text-dark: #1e293b;
      --text-light: #f8fafc;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: 'Outfit', sans-serif;
      background: url("bg.png") center center / 100% 100% no-repeat;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(0, 0, 0, 0.25) 0%, rgba(0, 0, 0, 0) 35%, rgba(0, 0, 0, 0.25) 100%);
      z-index: 1;
    }

    .timer-wrap {
      position: absolute;
      top: 44%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      z-index: 2;
    }

    .timer-label {
      color: #1e293b;
      font-family: 'Outfit', sans-serif;
      font-size: clamp(1rem, 2.4vw, 2.2rem);
      font-weight: 800;
      letter-spacing: 0.55em;
      text-transform: uppercase;
      margin-bottom: 18px;
      text-shadow: 0 1px 6px rgba(255, 255, 255, 0.55);
    }

    .timer {
      color: white;
      font-family: 'Outfit', sans-serif;
      font-size: 14vw;
      font-weight: 800;
      letter-spacing: 0.04em;
      font-variant-numeric: tabular-nums;
      line-height: 1;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.45), 0 8px 24px rgba(0, 0, 0, 0.35);
      cursor: text;
      outline: none;
    }

    .timer[contenteditable="true"] {
      border-bottom: 3px solid rgba(255, 255, 255, 0.8);
      text-shadow: 0 4px 14px rgba(0, 0, 0, 0.8);
    }

    .editor-hint {
      display: none;
    }

    .controls {
      position: absolute;
      bottom: 12%;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 14px;
      z-index: 2;
    }

    button {
      padding: 12px 24px;
      background: var(--primary-orange);
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1rem;
      font-weight: 600;
      font-family: inherit;
      box-shadow: 0 4px 14px rgba(243, 112, 33, 0.3);
      transition: transform 0.2s, background 0.2s, box-shadow 0.2s;
    }

    .btn-start:hover,
    .btn-start:active {
      background: var(--primary-orange-hover);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(243, 112, 33, 0.4);
    }

    .btn-pause {
      background: #64748b;
      box-shadow: 0 4px 14px rgba(100, 116, 139, 0.2);
    }

    .btn-pause:hover,
    .btn-pause:active {
      background: #475569;
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(100, 116, 139, 0.3);
    }

    .btn-reset {
      background: transparent;
      color: var(--text-dark);
      border: 1px solid #cbd5e1;
      box-shadow: none;
    }

    .btn-reset:hover,
    .btn-reset:active {
      background: rgba(0, 0, 0, 0.05);
      border-color: #94a3b8;
    }

    button:active {
      transform: translateY(0);
    }
  </style>
</head>

<body>

  <div class="overlay"></div>

  <div class="timer-wrap">
    <div class="timer-label">Discover Meet Starts In...</div>
    <div class="timer" id="timer-display" contenteditable="false">15:00</div>
  </div>
  <div class="controls">
    <button class="btn-start" onclick="startTimer()">Start</button>
    <button class="btn-pause" onclick="pauseTimer()">Pause</button>
    <button class="btn-reset" onclick="resetTimer()">Reset</button>
  </div>

  <audio id="music" src="music.mp3" loop preload="auto"></audio>

  <script>
    const TOTAL_SECONDS = 15 * 60;
    let totalSeconds = TOTAL_SECONDS;
    let durationSeconds = TOTAL_SECONDS;
    let timerInterval = null;

    const timerDisplay = document.getElementById("timer-display");
    const music = document.getElementById("music");

    function fmtDisplay() {
      const minutes = Math.floor(totalSeconds / 60);
      const seconds = totalSeconds % 60;
      return String(minutes).padStart(2, "0") + ":" + String(seconds).padStart(2, "0");
    }

    function render() {
      timerDisplay.textContent = fmtDisplay();
    }

    function updateTimer() {
      if (totalSeconds <= 0) {
        clearInterval(timerInterval);
        timerInterval = null;
        music.pause();
        timerDisplay.textContent = "00:00";
        return;
      }

      totalSeconds--;
      render();
    }

    function startTimer() {
      if (timerInterval) return;
      exitEditMode();

      if (music.src && !music.error) {
        music.play().catch(() => {});
      }

      updateTimer();
      timerInterval = setInterval(updateTimer, 1000);
    }

    function pauseTimer() {
      clearInterval(timerInterval);
      timerInterval = null;
      music.pause();
    }

    function resetTimer() {
      clearInterval(timerInterval);
      timerInterval = null;
      totalSeconds = durationSeconds;
      render();
      music.pause();
      music.currentTime = 0;
    }

    function parseInput(str) {
      const clean = str.replace(/\s/g, "");
      const pieces = clean.split(":");
      if (pieces.length === 2) {
        const m = parseInt(pieces[0], 10);
        const s = parseInt(pieces[1], 10);
        if (!isNaN(m) && !isNaN(s) && m >= 0 && s >= 0 && s < 60) {
          return m * 60 + s;
        }
      }
      const justMinutes = parseInt(clean, 10);
      if (!isNaN(justMinutes) && justMinutes >= 1) {
        return justMinutes * 60;
      }
      return null;
    }

    function enterEditMode() {
      if (timerInterval) return;
      timerDisplay.contentEditable = "true";
      timerDisplay.focus();
      const range = document.createRange();
      range.selectNodeContents(timerDisplay);
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
    }

    function exitEditMode() {
      timerDisplay.contentEditable = "false";
      window.getSelection().removeAllRanges();
    }

    function commitEdit() {
      const raw = timerDisplay.textContent;
      const parsed = parseInput(raw);
      if (parsed !== null && parsed > 0) {
        durationSeconds = parsed;
        totalSeconds = parsed;
        render();
      } else {
        render();
      }
      exitEditMode();
    }

    timerDisplay.addEventListener("click", enterEditMode);
    timerDisplay.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        commitEdit();
      } else if (e.key === "Escape") {
        render();
        exitEditMode();
      }
    });
    timerDisplay.addEventListener("blur", commitEdit);

    if (music.addEventListener) {
      music.addEventListener("error", () => {
        music.removeAttribute("src");
      });
    }

    render();
  </script>

</body>
</html>
